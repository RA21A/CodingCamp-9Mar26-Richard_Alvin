<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple productivity dashboard with timer, tasks, and quick links">
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Greeting Section -->
        <section id="greeting-section">
            <div id="time-display">--:--:-- --</div>
            <div id="date-display">Loading...</div>
            <div id="greeting-text">Welcome</div>
        </section>

        <!-- Focus Timer Section -->
        <section id="timer-section">
            <h2>Focus Timer</h2>
            <div id="timer-display">25:00</div>
            <div id="timer-controls">
                <button id="timer-start">Start</button>
                <button id="timer-stop">Stop</button>
                <button id="timer-reset">Reset</button>
            </div>
            <div id="timer-notification" class="hidden"></div>
        </section>

        <!-- Task Manager Section -->
        <section id="task-section">
            <h2>To-Do List</h2>
            <form id="task-form">
                <input type="text" id="task-input" placeholder="Add a new task..." maxlength="500">
                <button type="submit">Add</button>
            </form>
            <ul id="task-list"></ul>
        </section>

        <!-- Quick Links Section -->
        <section id="links-section">
            <h2>Quick Links</h2>
            <form id="link-form">
                <input type="text" id="link-name" placeholder="Website name..." maxlength="100">
                <input type="url" id="link-url" placeholder="https://...">
                <button type="submit">Add</button>
            </form>
            <div id="links-container"></div>
        </section>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
